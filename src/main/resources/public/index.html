<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BStore — Gestão de loja</title>
    <meta name="description" content="Sistema de gestão de loja, stock e vendas." />
    <script type="module" crossorigin src="/assets/index-Bho59dfD.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bht4w3Wv.css">
  </head>
  <body>
    <style>
      .boot-loader {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font:
          14px 'Segoe UI',
          sans-serif;
        color: #17634f;
        background: #f4f7f6;
        position: fixed;
        inset: 0;
      }
      .boot-spinner {
        width: 42px;
        height: 42px;
        border: 3px solid #17634f;
        border-right-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
        }
      }
    </style>
    <div id="root">
      <div class="boot-loader" role="status">
        <span class="boot-spinner" aria-hidden="true"></span>
        <p>A carregar o BStore…</p>
        <noscript>Ative o JavaScript no navegador para usar o BStore.</noscript>
      </div>
    </div>
  </body>
</html>
